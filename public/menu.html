<aside id="tvp-menu">
  <div id='tvp-menu-handle-container'>
    <div id='tvp-menu-handle'></div>
  </div>
  <section>
    <div class="tvp-menu-header">
      <h1>TradingviewPlus</h1>
      <button id="tvp-reset-button" type="button" title="Reset settings" aria-label="Reset settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8.27"/><path d="M3 3v5.27h5.27"/></svg>
      </button>
      <h3 id='tvp-menu-version'></h3>
      <input type="text">
    </div>

    <div class="accordion">

      <!-- Accordion for XM-only features (hidden on other platforms) -->
      <div class="tab" id="xm-features-tab">
        <input type="checkbox" name="accordion-3" id="cb3" class='hidden-input' checked>
        <h2><label for="cb3">XM Features <svg width="28" height="10" viewBox="0 0 48 30" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.64 0L24 18.32L42.36 0L48 5.64L24 29.64L0 5.64L5.64 0Z" fill="white"/></svg></label></h2>
        <div class="feature" id="xm-dropdown-content-container">

        </div>
      </div>

      <!-- Accordion for TVP features -->
      <div class="tab">
        <input type="checkbox" name="accordion-1" id="cb1" class='hidden-input' checked>
        <h2><label for="cb1">Custom Features <svg width="28" height="10" viewBox="0 0 48 30" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.64 0L24 18.32L42.36 0L48 5.64L24 29.64L0 5.64L5.64 0Z" fill="white"/></svg></label></h2>
        <div class="feature" id="custom-dropdown-content-container">

        </div>
      </div>

      <!-- Accordion for modified TV features -->
      <div class="tab">
        <input type="checkbox" name="accordion-2" id="cb2" class='hidden-input' checked>
        <h2><label for="cb2">Tradingview Features <svg width="28" height="10" viewBox="0 0 48 30" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.64 0L24 18.32L42.36 0L48 5.64L24 29.64L0 5.64L5.64 0Z" fill="white"/></svg></label></h2>
        <div class="feature" id="tradingview-dropdown-content-container">

        </div>
      </div>

    </div>

  </section>
</aside>
